name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/cloudconduction_payroll_test
      INTEGRATION_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/cloudconduction_payroll_test
      JWT_SECRET: ci-only-secret-value-replace-this-with-more-than-32-characters
      CLIENT_ORIGIN: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies from lockfile
        run: npm ci

      - name: Install server dependencies from lockfile
        run: npm ci --prefix server

      # npm's lockfile can omit platform-specific optional WASM dependencies when generated on Windows.
      # npm install reconciles this optional dependency tree for the Linux CI runner.
      - name: Install client dependencies (platform optional dependencies)
        run: npm install --include=optional --prefix client

      - name: Check authenticated API performance script syntax
        run: node --check server/src/scripts/authenticatedApiTest.js

      - name: Run API tests
        run: npm test

      - name: Run MongoDB-backed employee integration test
        run: npm run test:integration --prefix server

      - name: Build frontend
        run: npm run build
